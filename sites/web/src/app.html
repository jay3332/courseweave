<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f0f4f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e151c" media="(prefers-color-scheme: dark)" />
    <!-- Keep the description in sync with SITE_DESCRIPTION in src/lib/features/course/CourseHead.svelte. The web
         API replaces the description and Open Graph tags on course pages (crates/courses-web-api/src/seo.rs). -->
    <meta
      name="description"
      content="Search CMU courses, read FCEs, plan schedules and degrees, and see what your friends are taking."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CMU Courses" />
    <meta property="og:title" content="CMU Courses" />
    <meta
      property="og:description"
      content="Search CMU courses, read FCEs, plan schedules and degrees, and see what your friends are taking."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="CMU Courses: search courses, read FCEs, plan schedules and degrees"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "CMU Courses",
        "url": "/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "/?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    />
    <title>CMU Courses</title>
    <script>
      // Apply the color theme and skin before first paint so the page never flashes the
      // wrong look. Keep the storage keys, the one-mode skins and the fonts in sync with
      // the theme and skin stores (src/lib/components/shell/theme.svelte.ts, skin.svelte.ts).
      (function () {
        var preference = null;
        var skin = null;
        try {
          preference = localStorage.getItem("cmucourses:theme");
          skin = localStorage.getItem("cmucourses:skin");
        } catch (error) {
          preference = null;
        }
        var oneMode = { mono: "dark", soft: "light" };
        var fonts = {
          telegram: "family=Roboto:wght@400;500;700",
          discord: "family=Noto+Sans:wght@400;500;600;700",
          claude: "family=Source+Serif+4:opsz,wght@8..60,400..600",
          mono: "family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500",
          playful: "family=Nunito:wght@400;600;700;800&family=Fredoka:wght@500;600",
          soft: null,
        };
        var root = document.documentElement;
        var dark = oneMode[skin]
          ? oneMode[skin] === "dark"
          : preference === "dark" ||
            (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        root.classList.toggle("dark", dark);
        if (skin && Object.prototype.hasOwnProperty.call(fonts, skin)) {
          root.setAttribute("data-skin", skin);
          if (fonts[skin]) {
            var link = document.createElement("link");
            link.id = "skin-fonts";
            link.rel = "stylesheet";
            link.href = "https://fonts.googleapis.com/css2?" + fonts[skin] + "&display=swap";
            document.head.appendChild(link);
          }
        }
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
